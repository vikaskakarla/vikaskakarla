<svg fill="none" viewBox="0 0 800 150" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Heavy blur for soft backlighting -->
    <filter id="auroraBlur">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    
    <!-- Glass border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Glass card drop shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="800" height="150" rx="20" fill="#07060F"/>
  
  <!-- Aurora Glow behind Card -->
  <g filter="url(#auroraBlur)" opacity="0.55">
    <circle cx="350" cy="75" r="90" fill="#bd93f9">
      <animate attributeName="cx" values="350;450;350" dur="15s" repeatCount="indefinite" />
      <animate attributeName="r" values="90;110;90" dur="15s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="75" r="80" fill="#ff79c6">
      <animate attributeName="cx" values="500;400;500" dur="18s" repeatCount="indefinite" />
      <animate attributeName="r" values="80;95;80" dur="18s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Outer border stroke -->
  <rect width="800" height="150" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1.5"/>

  <!-- Frosted Glass Card -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="20" width="700" height="110" rx="18" fill="#FFFFFF" fill-opacity="0.015" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <path d="M 68 20 L 732 20" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
  </g>

  <!-- macOS Window Controls -->
  <circle cx="75" cy="38" r="4.5" fill="#ff5f56"/>
  <circle cx="89" cy="38" r="4.5" fill="#ffbd2e"/>
  <circle cx="103" cy="38" r="4.5" fill="#27c93f"/>

  <!-- Translucent giant quotation mark -->
  <text x="70" y="105" font-family="Georgia, serif" font-size="110" font-weight="900" fill="#FFFFFF" fill-opacity="0.04">“</text>

  <!-- Quote Typography -->
  <style>
    .quote-txt {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      font-size: 14.5px;
      fill: #FFFFFF;
      letter-spacing: -0.1px;
    }
    .author-txt {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 10px;
      fill: #00f5d4;
      letter-spacing: 2px;
    }
  </style>

  <!-- Quote Texts -->
  <text x="125" y="58" class="quote-txt">“The people who are crazy enough to think they can change the world</text>
  <text x="125" y="80" class="quote-txt">are the ones who do.”</text>
  <text x="125" y="106" class="author-txt">STEVE JOBS</text>
  
  <!-- Subtle decorative code tag on the right side -->
  <text x="715" y="38" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="9" font-weight="600" fill="#bd93f9" opacity="0.6">SYS.QUOTE_CORE // v1.0.0</text>
</svg>
