<svg fill="none" viewBox="0 0 800 150" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="50%" stop-color="#9356E4"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <filter id="borderGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .card { 
      fill: #060608; 
      stroke: url(#cyberGrad); 
      stroke-width: 1.5; 
      filter: url(#borderGlow);
    }
    .quote {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #FFFFFF;
      letter-spacing: -0.2px;
    }
    .author {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 13px;
      fill: #00F2FE;
      letter-spacing: 1px;
    }
    .grid-pattern {
      opacity: 0.05;
      stroke: #FFFFFF;
      stroke-width: 1;
    }
  </style>

  <!-- Card Body -->
  <rect width="800" height="150" rx="16" class="card"/>
  
  <!-- Subtle Grid Overlay -->
  <g class="grid-pattern">
    <line x1="0" y1="30" x2="800" y2="30"/>
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="100" y1="0" x2="100" y2="150"/>
    <line x1="200" y1="0" x2="200" y2="150"/>
    <line x1="300" y1="0" x2="300" y2="150"/>
    <line x1="400" y1="0" x2="400" y2="150"/>
    <line x1="500" y1="0" x2="500" y2="150"/>
    <line x1="600" y1="0" x2="600" y2="150"/>
    <line x1="700" y1="0" x2="700" y2="150"/>
  </g>

  <!-- Quote Text -->
  <text x="40" y="60" class="quote">“The people who are crazy enough to think they can change the world</text>
  <text x="40" y="88" class="quote">are the ones who do.”</text>
  <text x="40" y="118" class="author">SYS.INIT // STEVE_JOBS</text>
  
  <!-- Tech graphic corner accent -->
  <path d="M 770 120 L 770 140 L 750 140" stroke="#FF007F" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 30 10 L 10 10 L 10 30" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.8"/>
</svg>
