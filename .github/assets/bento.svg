<svg fill="none" viewBox="0 0 800 300" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur-small">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <style>
    .card {
      fill: #0A0A0C;
      stroke: #222226;
      stroke-width: 1;
    }
    .header {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 18px;
      fill: #F5F5F7;
    }
    .text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      fill: #86868B;
      line-height: 1.6;
    }
    .bold {
      font-weight: 600;
      fill: #F5F5F7;
    }
    .tag {
      fill: #161617;
      stroke: #222226;
      stroke-width: 1;
      rx: 6px;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #F5F5F7;
    }
  </style>

  <!-- Left Bento Box -->
  <g transform="translate(0, 0)">
    <rect width="385" height="300" rx="16" class="card"/>
    <text x="30" y="45" class="header"> Inside the Engine</text>
    <text x="30" y="85" class="text">Vikas is a builder focused on performance,</text>
    <text x="30" y="110" class="text">modular architecture, and beautiful interfaces.</text>
    <text x="30" y="135" class="text">He believes true design is about how</text>
    <text x="30" y="160" class="text">something works, not just how it looks.</text>

    <!-- Bullets -->
    <circle cx="35" cy="205" r="3" fill="#9356E4"/>
    <text x="50" y="209" class="text"><tspan class="bold">Philosophy:</tspan> Less but better.</text>

    <circle cx="35" cy="235" r="3" fill="#4B7BEC"/>
    <text x="50" y="239" class="text"><tspan class="bold">Core Focus:</tspan> React, Node.js, and Cloud.</text>

    <circle cx="35" cy="265" r="3" fill="#38EF7D"/>
    <text x="50" y="269" class="text"><tspan class="bold">Standard:</tspan> Clean code, robust tests.</text>
  </g>

  <!-- Right Bento Box -->
  <g transform="translate(415, 0)">
    <rect width="385" height="300" rx="16" class="card"/>
    <text x="30" y="45" class="header">🛠️ The Tool Belt</text>
    <text x="30" y="80" class="text">A curated selection of tools and languages</text>
    <text x="30" y="105" class="text">used to build premium applications:</text>

    <!-- Animated Apple Intelligence wave icon in top right corner -->
    <g transform="translate(325, 25)">
      <circle cx="15" cy="15" r="10" fill="#FF007F" opacity="0.35" filter="url(#blur-small)">
        <animate attributeName="r" values="10;15;10" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="15" r="8" fill="#4B7BEC" opacity="0.35" filter="url(#blur-small)">
        <animate attributeName="r" values="8;13;8" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="15" r="6" fill="#38EF7D" opacity="0.35" filter="url(#blur-small)">
        <animate attributeName="r" values="6;11;6" dur="4.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Tag Grid -->
    <!-- Row 1 -->
    <g transform="translate(30, 130)">
      <rect width="90" height="26" rx="6" class="tag"/>
      <text x="45" y="17" text-anchor="middle" class="tag-text">TypeScript</text>
    </g>
    <g transform="translate(130, 130)">
      <rect width="70" height="26" rx="6" class="tag"/>
      <text x="35" y="17" text-anchor="middle" class="tag-text">React</text>
    </g>
    <g transform="translate(210, 130)">
      <rect width="80" height="26" rx="6" class="tag"/>
      <text x="40" y="17" text-anchor="middle" class="tag-text">Next.js</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(30, 170)">
      <rect width="80" height="26" rx="6" class="tag"/>
      <text x="40" y="17" text-anchor="middle" class="tag-text">Node.js</text>
    </g>
    <g transform="translate(120, 170)">
      <rect width="60" height="26" rx="6" class="tag"/>
      <text x="30" y="17" text-anchor="middle" class="tag-text">Go</text>
    </g>
    <g transform="translate(190, 170)">
      <rect width="70" height="26" rx="6" class="tag"/>
      <text x="35" y="17" text-anchor="middle" class="tag-text">Python</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(30, 210)">
      <rect width="60" height="26" rx="6" class="tag"/>
      <text x="30" y="17" text-anchor="middle" class="tag-text">AWS</text>
    </g>
    <g transform="translate(100, 210)">
      <rect width="80" height="26" rx="6" class="tag"/>
      <text x="40" y="17" text-anchor="middle" class="tag-text">GraphQL</text>
    </g>
    <g transform="translate(190, 210)">
      <rect width="70" height="26" rx="6" class="tag"/>
      <text x="35" y="17" text-anchor="middle" class="tag-text">Docker</text>
    </g>
  </g>
</svg>
