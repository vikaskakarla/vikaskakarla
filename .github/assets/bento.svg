<svg fill="none" viewBox="0 0 800 300" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="50%" stop-color="#9356E4"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <filter id="borderGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="radarGlow">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>

  <style>
    .card {
      fill: #060608;
      stroke: url(#cyberGrad);
      stroke-width: 1.5;
      filter: url(#borderGlow);
    }
    .header {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 16px;
      fill: #00F2FE;
      letter-spacing: 1px;
    }
    .text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13.5px;
      fill: #9CA3AF;
      line-height: 1.6;
    }
    .bold {
      font-weight: 700;
      fill: #FFFFFF;
      font-family: 'Courier New', Courier, monospace;
    }
    .tag {
      fill: #0E0F14;
      stroke: #1F2937;
      stroke-width: 1;
      rx: 6px;
    }
    .tag-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #00F2FE;
    }
  </style>

  <!-- Left Bento Box: Engine/Philosophy -->
  <g transform="translate(0, 0)">
    <rect width="385" height="300" rx="16" class="card"/>
    <text x="30" y="45" class="header">EXEC // INSIDE_THE_ENGINE</text>
    <text x="30" y="85" class="text">Vikas is a builder focused on performance,</text>
    <text x="30" y="110" class="text">modular architecture, and beautiful interfaces.</text>
    <text x="30" y="135" class="text">He believes true design is about how</text>
    <text x="30" y="160" class="text">something works, not just how it looks.</text>

    <!-- Bullets -->
    <rect x="30" y="198" width="6" height="6" fill="#FF007F"/>
    <text x="48" y="205" class="text"><tspan class="bold">PHILOSOPHY:</tspan> Less but better.</text>

    <rect x="30" y="228" width="6" height="6" fill="#9356E4"/>
    <text x="48" y="235" class="text"><tspan class="bold">CORE_FOCUS:</tspan> React, Node.js, and Cloud.</text>

    <rect x="30" y="258" width="6" height="6" fill="#00F2FE"/>
    <text x="48" y="265" class="text"><tspan class="bold">STANDARD :</tspan> Clean code, robust tests.</text>
  </g>

  <!-- Right Bento Box: Stack -->
  <g transform="translate(415, 0)">
    <rect width="385" height="300" rx="16" class="card"/>
    <text x="30" y="45" class="header">SYSTEM // CURATED_STACK</text>
    <text x="30" y="80" class="text">A curated selection of tools and languages</text>
    <text x="30" y="105" class="text">used to build premium applications:</text>

    <!-- Tech Radar Animation in Background (very subtle grid) -->
    <g opacity="0.08" transform="translate(290, 45)">
      <circle cx="40" cy="40" r="30" fill="none" stroke="#FFFFFF" stroke-width="1"/>
      <circle cx="40" cy="40" r="20" fill="none" stroke="#FFFFFF" stroke-width="1"/>
      <circle cx="40" cy="40" r="10" fill="none" stroke="#FFFFFF" stroke-width="1"/>
      <line x1="40" y1="0" x2="40" y2="80" stroke="#FFFFFF" stroke-width="1"/>
      <line x1="0" y1="40" x2="80" y2="40" stroke="#FFFFFF" stroke-width="1"/>
      
      <!-- Sweep line -->
      <line x1="40" y1="40" x2="80" y2="40" stroke="#00F2FE" stroke-width="2" filter="url(#radarGlow)">
        <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="4s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Tag Grid -->
    <!-- Row 1 -->
    <g transform="translate(30, 130)">
      <rect width="90" height="26" rx="6" class="tag"/>
      <text x="45" y="17" text-anchor="middle" class="tag-text">TypeScript</text>
    </g>
    <g transform="translate(130, 130)">
      <rect width="70" height="26" rx="6" class="tag"/>
      <text x="35" y="17" text-anchor="middle" class="tag-text">React</text>
    </g>
    <g transform="translate(210, 130)">
      <rect width="80" height="26" rx="6" class="tag"/>
      <text x="40" y="17" text-anchor="middle" class="tag-text">Next.js</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(30, 170)">
      <rect width="80" height="26" rx="6" class="tag"/>
      <text x="40" y="17" text-anchor="middle" class="tag-text">Node.js</text>
    </g>
    <g transform="translate(120, 170)">
      <rect width="60" height="26" rx="6" class="tag"/>
      <text x="30" y="17" text-anchor="middle" class="tag-text">Go</text>
    </g>
    <g transform="translate(190, 170)">
      <rect width="70" height="26" rx="6" class="tag"/>
      <text x="35" y="17" text-anchor="middle" class="tag-text">Python</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(30, 210)">
      <rect width="60" height="26" rx="6" class="tag"/>
      <text x="30" y="17" text-anchor="middle" class="tag-text">AWS</text>
    </g>
    <g transform="translate(100, 210)">
      <rect width="80" height="26" rx="6" class="tag"/>
      <text x="40" y="17" text-anchor="middle" class="tag-text">GraphQL</text>
    </g>
    <g transform="translate(190, 210)">
      <rect width="70" height="26" rx="6" class="tag"/>
      <text x="35" y="17" text-anchor="middle" class="tag-text">Docker</text>
    </g>
  </g>
</svg>
