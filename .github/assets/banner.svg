<svg fill="none" viewBox="0 0 800 300" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur">
      <feGaussianBlur stdDeviation="70" />
    </filter>
  </defs>
  
  <rect width="800" height="300" rx="20" fill="#0A0A0C"/>
  
  <g opacity="0.65">
    <!-- Apple Intelligence Liquid Glowing Blobs -->
    <circle cx="280" cy="120" r="100" fill="#FF007F">
      <animate attributeName="cx" values="280;340;250;280" dur="14s" repeatCount="indefinite" />
      <animate attributeName="cy" values="120;180;90;120" dur="14s" repeatCount="indefinite" />
      <animate attributeName="r" values="100;130;95;100" dur="14s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="520" cy="180" r="90" fill="#4B7BEC">
      <animate attributeName="cx" values="520;460;550;520" dur="16s" repeatCount="indefinite" />
      <animate attributeName="cy" values="180;120;210;180" dur="16s" repeatCount="indefinite" />
      <animate attributeName="r" values="90;125;85;90" dur="16s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="400" cy="100" r="125" fill="#38EF7D">
      <animate attributeName="cx" values="400;450;350;400" dur="18s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;155;75;100" dur="18s" repeatCount="indefinite" />
      <animate attributeName="r" values="125;95;135;125" dur="18s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="320" cy="220" r="80" fill="#9356E4">
      <animate attributeName="cx" values="320;260;350;320" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="220;180;240;220" dur="12s" repeatCount="indefinite" />
      <animate attributeName="r" values="80;105;75;80" dur="12s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <rect width="800" height="300" rx="20" fill="none" stroke="#222226" stroke-width="1"/>
  
  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 40px;
      fill: #F5F5F7;
      letter-spacing: -1.2px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #86868B;
      letter-spacing: 2.5px;
    }
  </style>
  
  <text x="400" y="140" dominant-baseline="middle" text-anchor="middle" class="title">VIKAS KAKARLA</text>
  <text x="400" y="185" dominant-baseline="middle" text-anchor="middle" class="subtitle">DEVELOPER • DESIGNER • ARCHITECT</text>
</svg>
