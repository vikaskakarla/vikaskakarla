<svg fill="none" viewBox="0 0 800 300" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Blur filters -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Linear Gradients -->
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9356E4" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0.8"/>
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#9356E4"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
    
    <!-- Grid Horizon Fading Mask -->
    <mask id="fadeMask">
      <rect width="800" height="300" fill="url(#maskGrad)" />
    </mask>
    <linearGradient id="maskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="25%" stop-color="#000000" />
      <stop offset="60%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>
  
  <!-- Deep Obsidian Background -->
  <rect width="800" height="300" rx="20" fill="#060608"/>
  <rect width="800" height="300" rx="20" fill="none" stroke="#1A1A24" stroke-width="1.5"/>

  <!-- Liquid Ambient Under-Glow -->
  <g opacity="0.35" filter="url(#blur)">
    <circle cx="200" cy="180" r="100" fill="#FF007F">
      <animate attributeName="cx" values="200;250;180;200" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="180;220;150;180" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="120" r="110" fill="#00F2FE">
      <animate attributeName="cx" values="600;550;620;600" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="120;90;160;120" dur="12s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 3D Perspectives Cyberpunk Grid (Animated Loop) -->
  <g mask="url(#fadeMask)">
    <!-- Converging Perspective Lines -->
    <g stroke="url(#gridGrad)" stroke-width="1">
      <line x1="400" y1="70" x2="-400" y2="300" />
      <line x1="400" y1="70" x2="-200" y2="300" />
      <line x1="400" y1="70" x2="0" y2="300" />
      <line x1="400" y1="70" x2="200" y2="300" />
      <line x1="400" y1="70" x2="400" y2="300" />
      <line x1="400" y1="70" x2="600" y2="300" />
      <line x1="400" y1="70" x2="800" y2="300" />
      <line x1="400" y1="70" x2="1000" y2="300" />
      <line x1="400" y1="70" x2="1200" y2="300" />
    </g>

    <!-- Moving Horizontal Lines (Simulating forward motion) -->
    <g stroke="url(#gridGrad)" stroke-width="1.5">
      <line x1="-400" y1="0" x2="1200" y2="0">
        <animate attributeName="y1" values="70;300" dur="3s" repeatCount="indefinite" />
        <animate attributeName="y2" values="70;300" dur="3s" repeatCount="indefinite" />
      </line>
      <line x1="-400" y1="0" x2="1200" y2="0">
        <animate attributeName="y1" values="70;300" dur="3s" begin="0.75s" repeatCount="indefinite" />
        <animate attributeName="y2" values="70;300" dur="3s" begin="0.75s" repeatCount="indefinite" />
      </line>
      <line x1="-400" y1="0" x2="1200" y2="0">
        <animate attributeName="y1" values="70;300" dur="3s" begin="1.5s" repeatCount="indefinite" />
        <animate attributeName="y2" values="70;300" dur="3s" begin="1.5s" repeatCount="indefinite" />
      </line>
      <line x1="-400" y1="0" x2="1200" y2="0">
        <animate attributeName="y1" values="70;300" dur="3s" begin="2.25s" repeatCount="indefinite" />
        <animate attributeName="y2" values="70;300" dur="3s" begin="2.25s" repeatCount="indefinite" />
      </line>
    </g>
  </g>

  <!-- Glowing Neon Core Portal -->
  <circle cx="400" cy="70" r="40" fill="none" stroke="#FF007F" stroke-width="2" opacity="0.8">
    <animate attributeName="r" values="40;45;40" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#FF007F;#00F2FE;#9356E4;#FF007F" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="70" r="28" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="28;25;28" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#00F2FE;#9356E4;#FF007F;#00F2FE" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Cyberpunk Sleek Tech Data Accents -->
  <line x1="40" y1="35" x2="120" y2="35" stroke="#FF007F" stroke-width="2" opacity="0.7"/>
  <circle cx="120" cy="35" r="3" fill="#FF007F" opacity="0.7"/>
  <line x1="760" y1="35" x2="680" y2="35" stroke="#00F2FE" stroke-width="2" opacity="0.7"/>
  <circle cx="680" cy="35" r="3" fill="#00F2FE" opacity="0.7"/>

  <!-- Typography -->
  <style>
    .title {
      font-family: 'Courier New', Courier, monospace, sans-serif;
      font-weight: 900;
      font-size: 44px;
      letter-spacing: 4px;
    }
    .neon-glow {
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #86868B;
      letter-spacing: 5px;
    }
  </style>

  <!-- Glowing Title Overlay -->
  <text x="400" y="160" dominant-baseline="middle" text-anchor="middle" class="title neon-glow" filter="url(#textGlow)">VIKAS KAKARLA</text>
  <text x="400" y="160" dominant-baseline="middle" text-anchor="middle" class="title neon-glow">VIKAS KAKARLA</text>
  
  <text x="400" y="210" dominant-baseline="middle" text-anchor="middle" class="subtitle">SYS.ARCHITECT // FULL-STACK BUILDER</text>
</svg>
